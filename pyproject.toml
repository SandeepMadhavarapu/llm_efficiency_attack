[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_efficiency_attack"
version = "0.1.0"
description = "White-box efficiency attacks against Hugging Face sequence models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sandeep Madhavarapu" }]
keywords = ["adversarial", "efficiency", "nlp", "transformers", "white-box"]

# Pinned to the versions this was developed and tested against. Lower bounds are
# real requirements rather than guesses: `torch>=2.0` for the current autograd
# behaviour used by the HotFlip step, and `transformers>=4.40` for the
# `inputs_embeds` path through `generate()` that the seq2seq adapter relies on.
dependencies = [
    "torch>=2.0,<3.0",
    "transformers>=4.40,<6.0",
]

[project.urls]
Homepage = "https://github.com/SandeepMadhavarapu/llm_efficiency_attack"
Repository = "https://github.com/SandeepMadhavarapu/llm_efficiency_attack"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# `sentencepiece` is not needed by the library, and on the transformers version
# tested here (5.16) `t5-small` loads without it. It is kept as an extra because
# older transformers releases inside the supported range fall back to the slow
# SentencePiece tokenizer for T5, which does require it.
examples = [
    "sentencepiece>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
