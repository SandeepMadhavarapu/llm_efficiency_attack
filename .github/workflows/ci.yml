name: CI

# Purpose: prove the documented installation works from a fresh checkout in a
# clean environment. This project was developed on Windows, where a local
# Application Control policy prevented creating a throwaway virtualenv that
# could load Torch's DLLs -- so the literal `pip install -e ".[dev,examples]"`
# path could not be exercised locally. This workflow closes that gap on a clean
# Linux runner.
#
# The test suite is fully offline: fixtures are built from configs with random
# weights and nothing here downloads a model. Tests that need a real checkpoint
# are marked `integration` and are skipped unless `--run-integration` is passed;
# they are run separately rather than here, to keep CI hermetic.
#
# Note on scope: GitHub-hosted runners have no GPU, so the CUDA test skips here
# exactly as it does locally. CI proves installation and the CPU test suite; it
# does not prove the CUDA path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clean-install:
    name: Clean install and test suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out a fresh copy of the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Deliberately the exact command from the README, with no CPU-wheel index
      # or other shortcut, so that what CI proves is what the README instructs.
      - name: Install the package exactly as the README documents
        run: python -m pip install -e ".[dev,examples]"

      - name: Record the resolved environment
        run: |
          python -c "import sys, platform; print('python', sys.version); print('platform', platform.platform())"
          python -c "import torch; print('torch', torch.__version__, '| cuda available:', torch.cuda.is_available())"
          python -c "import transformers; print('transformers', transformers.__version__)"
          python -c "import llm_efficiency_attack as m; print('package', m.__version__, 'from', m.__file__)"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
